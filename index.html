    <script>
      var d = document.documentElement;
      d.classList.add('js');
      // The fish splash plays once per visit, never for reduced motion.
      try {
        if (!sessionStorage.getItem('fc-splash') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('splash');
          sessionStorage.setItem('fc-splash', '1');
        }
      } catch (e) {}
    </script>
    <title>The Fish &amp; Chip Shop | Proper fish and chips in Johannesburg</title>
    <meta name="description" content="Family run fish and chips battered with love since 2018. Find our stores in Victoria Yards, Greenvalley and Parkrand, and see the menu." />
